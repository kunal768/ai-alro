server {
    listen 80;

    # React SPA — serve static files, fall back to index.html for client-side routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Intake Agent
    location /api/intake/ {
        proxy_pass         http://intake_agent:8002/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Optimizer Agent
    location /api/optimizer/ {
        proxy_pass         http://optimizer_agent:8003/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Reasoner Agent — SSE-safe settings prevent nginx from buffering the stream
    location /api/reasoner/ {
        proxy_pass             http://reasoner_agent:8004/;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;

        # SSE requirements
        proxy_buffering        off;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_read_timeout     300s;
    }
}
