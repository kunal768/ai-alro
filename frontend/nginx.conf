server {
    listen 80;

    # React SPA — serve static files, fall back to index.html for client-side routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Intake Agent
    # DOCKER: http://intake_agent:8002/
    # ECS:    http://intake_agent.alro.local:8002/
    location /api/intake/ {
        proxy_pass         http://${INTAKE_HOST}:8002/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Optimizer Agent
    # DOCKER: http://optimizer_agent:8003/
    # ECS:    http://optimizer_agent.alro.local:8003/
    location /api/optimizer/ {
        proxy_pass         http://${OPTIMIZER_HOST}:8003/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Reasoner Agent — SSE-safe settings prevent nginx from buffering the stream
    # DOCKER: http://reasoner_agent:8004/
    # ECS:    http://reasoner_agent.alro.local:8004/
    location /api/reasoner/ {
        proxy_pass             http://${REASONER_HOST}:8004/;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;

        # SSE requirements
        proxy_buffering        off;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_read_timeout     300s;
    }
}
