version: "3.9"

# ── Healthcheck helper ────────────────────────────────────────────────────────
# Uses Python's built-in urllib so no extra curl/wget binary is needed in
# the slim images.
x-health: &default-health
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 15s

services:

  erp_service:
    build:
      context: ./backend
      dockerfile: erp_service/Dockerfile
    ports:
      - "8001:8001"
    env_file: ./backend/.env
    networks:
      - alro_net
    healthcheck:
      <<: *default-health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"

  intake_agent:
    build:
      context: ./backend
      dockerfile: intake_agent/Dockerfile
    ports:
      - "8002:8002"
    env_file: ./backend/.env
    depends_on:
      erp_service:
        condition: service_healthy
    networks:
      - alro_net
    healthcheck:
      <<: *default-health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"

  optimizer_agent:
    build:
      context: ./backend
      dockerfile: optimizer_agent/Dockerfile
    ports:
      - "8003:8003"
    env_file: ./backend/.env
    depends_on:
      erp_service:
        condition: service_healthy
    networks:
      - alro_net
    healthcheck:
      <<: *default-health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"

  reasoner_agent:
    build:
      context: ./backend
      dockerfile: reasoner_agent/Dockerfile
    ports:
      - "8004:8004"
    env_file: ./backend/.env
    depends_on:
      intake_agent:
        condition: service_healthy
      optimizer_agent:
        condition: service_healthy
    networks:
      - alro_net
    healthcheck:
      <<: *default-health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - INTAKE_HOST=intake_agent
      - OPTIMIZER_HOST=optimizer_agent
      - REASONER_HOST=reasoner_agent
    depends_on:
      reasoner_agent:
        condition: service_healthy
    networks:
      - alro_net

networks:
  alro_net:
    driver: bridge
