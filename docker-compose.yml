version: "3.9"

services:
  erp_service:
    build:
      context: ./backend
      dockerfile: erp_service/Dockerfile
    ports:
      - "8001:8001"
    env_file: ./backend/.env
    networks:
      - alro_net

  intake_agent:
    build:
      context: ./backend
      dockerfile: intake_agent/Dockerfile
    ports:
      - "8002:8002"
    env_file: ./backend/.env
    depends_on:
      - erp_service
    networks:
      - alro_net

  optimizer_agent:
    build:
      context: ./backend
      dockerfile: optimizer_agent/Dockerfile
    ports:
      - "8003:8003"
    env_file: ./backend/.env
    depends_on:
      - intake_agent
    networks:
      - alro_net

  reasoner_agent:
    build:
      context: ./backend
      dockerfile: reasoner_agent/Dockerfile
    ports:
      - "8004:8004"
    env_file: ./backend/.env
    depends_on:
      - optimizer_agent
    networks:
      - alro_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    networks:
      - alro_net

networks:
  alro_net:
    driver: bridge
